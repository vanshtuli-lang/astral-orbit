# Barclays Oracle-to-SFTP ingestion, built by dag-factory.
# Onboard a tenant by adding one top-level DAG block below; the key is the dag_id.
default:
  description: Config-generated full-table Oracle export into SFTP
  doc_md: |
    Simple Barclays Oracle-to-SFTP ingestion, generated by dag-factory from
    `dags/Barclays_ingestion_tenants.yml`. The SFTP server represents the final
    S3-style landing zone for this demo.

    1. `extract_table_to_csv` reads the complete Oracle table and writes one staged CSV.
    2. `publish_csv` moves the staged CSV into the tenant's final landing folder.

    The first task also provides the basic checks: if Oracle is unavailable, the
    table does not exist, or SFTP is not writable, it fails with the provider error.
  start_date:
    __type__: pendulum.datetime
    year: 2026
    month: 9
    day: 28
    tz: America/New_York
  catchup: false
  is_paused_upon_creation: true
  max_active_runs: 1
  tags: [barclays, oracle, sftp, ingestion-factory, demo]
  default_args:
    owner: edp-ingestion
    retries: 2

Barclays_customer_transactions_ingestion:
  schedule: "0 */4 * * *"
  tasks:
    - task_id: extract_table_to_csv
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable: Barclays_ingestion_tasks.extract_table_to_csv
      op_kwargs:
        oracle_conn_id: oracle_jefferies_settlement
        sftp_conn_id: sftp_claims
        source_table: BARCLAYS_CUSTOMER_TRANSACTIONS
        columns: [TRANSACTION_ID, ACCOUNT_ID, AMOUNT, LAST_UPDATED_TS]
        landing_path: Barclays_ingestion/customer_transactions
    - task_id: publish_csv
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable: Barclays_ingestion_tasks.publish_csv
      op_kwargs:
        sftp_conn_id: sftp_claims
        source_table: BARCLAYS_CUSTOMER_TRANSACTIONS
        landing_path: Barclays_ingestion/customer_transactions
        tenant: retail_banking
      dependencies: [extract_table_to_csv]

Barclays_customer_accounts_ingestion:
  schedule: "0 */6 * * *"
  tasks:
    - task_id: extract_table_to_csv
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable: Barclays_ingestion_tasks.extract_table_to_csv
      op_kwargs:
        oracle_conn_id: oracle_jefferies_settlement
        sftp_conn_id: sftp_claims
        source_table: BARCLAYS_CUSTOMER_ACCOUNTS
        columns: [ACCOUNT_ID, CUSTOMER_ID, ACCOUNT_STATUS, LAST_UPDATED_TS]
        landing_path: Barclays_ingestion/customer_accounts
    - task_id: publish_csv
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable: Barclays_ingestion_tasks.publish_csv
      op_kwargs:
        sftp_conn_id: sftp_claims
        source_table: BARCLAYS_CUSTOMER_ACCOUNTS
        landing_path: Barclays_ingestion/customer_accounts
        tenant: corporate_banking
      dependencies: [extract_table_to_csv]
